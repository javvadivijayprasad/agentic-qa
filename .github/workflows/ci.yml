name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run fixture:make && git diff --exit-code -- examples/fixture-ledger/events.jsonl
      - run: node dist/cli.js replay examples/fixture-ledger --out /dev/null
        if: runner.os != 'Windows'
      - run: node dist/cli.js replay examples/fixture-ledger --out NUL
        if: runner.os == 'Windows'
